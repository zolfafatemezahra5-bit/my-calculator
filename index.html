<!DOCTYPE html>
<html lang="fa">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <title>ماشین حساب حرفه‌ای</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; font-family: 'Segoe UI', sans-serif; }
        
        .calculator {
            background-color: #34495e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            width: 300px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 28px;
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background-color: #ecf0f1;
            box-sizing: border-box;
            color: #2c3e50;
        }

        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #95a5a6;
            color: white;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active { transform: scale(0.95); }

    
        .op { background-color: #e67e22; } 
        .special { background-color: #c0392b; } 
        .equal { background-color: #27ae60; grid-column: span 2; } 
        button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled placeholder="0">
    <div class="buttons">
        <button class="special" onclick="clearDisplay()">C</button>
        <button class="special" onclick="backspace()">⌫</button>
        <button class="op" onclick="append('/')">/</button>
        <button class="op" onclick="append('*')">×</button>

        <button onclick="append('7')">7</button> <button onclick="append('8')">8</button> <button onclick="append('9')">9</button> <button class="op" onclick="append('-')">-</button>
        <button onclick="append('4')">4</button> <button onclick="append('5')">5</button> <button onclick="append('6')">6</button> <button onclick="append('+')">+</button>
        <button onclick="append('1')">1</button> <button onclick="append('2')">2</button> <button onclick="append('3')">3</button> <button onclick="append('.')">.</button>
        
        <button onclick="append('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function append(value) { display.value += value; }
    function clearDisplay() { display.value = ''; }
    function backspace() { display.value = display.value.slice(0, -1); }

    function calculate() {
        try {
            let result = eval(display.value);
            display.value = parseFloat(result.toFixed(10));
        } catch {
            display.value = 'خطا';
        }
    }
</script>

</body>
</html>
